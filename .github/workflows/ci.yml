name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # For the integration tests' table. Without this GitHub will not mint the
      # token at all, and the failure reads as a credentials error rather than
      # as a missing permission.
      id-token: write

    env:
      # A table per run, in a region that holds no real data, under the only
      # name prefix the credential is allowed to touch. run_attempt is in the
      # name because a re-run of the same workflow would otherwise collide with
      # a table the first attempt may not have finished deleting.
      LEDGER_TEST_TABLE: tightarse-citest-${{ github.run_id }}-${{ github.run_attempt }}
      AWS_REGION: eu-west-2

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # First, because it takes seconds and needs no credentials. Enforces the
      # package boundaries: no AWS SDK in domain code, no driving adapter
      # importing another, no import missing from its own manifest. Until this
      # existed `npm run lint` delegated to workspace scripts that no workspace
      # implemented, so it succeeded having run nothing — #40.
      #
      # The rules are themselves tested, in packages/ports/src/architecture.test.ts,
      # because a `files` glob that matches nothing produces the same clean run as
      # a codebase with no violations.
      - name: Lint
        run: npm run lint

      # Covers test files too, under three configs: the strict root one, infra's
      # relaxed CDK settings, and web's own. Test files are excluded from the
      # build, so until this existed nothing checked their types.
      - name: Typecheck
        run: npm run typecheck

      # Real DynamoDB rather than the emulator, because the emulator is wrong in
      # exactly the place this schema is interesting: the same suite took
      # different paths against Local and against real DynamoDB, and
      # putEnrichment is a TransactWriteItems carrying a ConditionCheck, which
      # is where the divergence concentrates.
      #
      # This role can do nothing but DynamoDB, only in eu-west-2, and only to
      # tables named tightarse-citest-*. It is deliberately not the deploy role:
      # that one can assume the CDK bootstrap roles, and this job runs on every
      # pull request.
      #
      # A pull request from a fork carries the fork's OIDC subject, matches no
      # trust policy here, and fails this step. That is the intended outcome —
      # the alternative is a run whose integration tests skip in silence.
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::707256068475:role/tightarse-dev-github-citest
          aws-region: eu-west-2
          role-session-name: gha-citest-${{ github.run_id }}

      - name: Create the ephemeral ledger table
        run: npm run create-test-table -w @tightarse/dynamodb

      # Coverage thresholds are pinned per package at what it achieves today, so
      # this fails when coverage falls rather than when it misses an arbitrary
      # target. See vitest.shared.ts.
      - name: Test with coverage thresholds
        run: npm run test:coverage

      # always(), because a failed test run still leaves a table behind, and a
      # table per run adds up. The script refuses any name outside the citest
      # prefix, so a mistyped variable here cannot delete anything that matters.
      - name: Destroy the ephemeral ledger table
        if: always()
        run: npm run create-test-table -w @tightarse/dynamodb -- --delete

      # The web stack deploys web/dist as an asset, so synth cannot run without
      # it. CI never built it, and every push since "Add the dashboard hosting
      # stack" failed here — twenty commits of red that nobody looked at.
      - name: Build the web app
        run: npm run build -w @tightarse/web

      - name: Synth CDK
        run: npm run synth

  # A separate job so it runs alongside `build` rather than after it: the sweep
  # takes about six and a half minutes, and adding that to the critical path of
  # every pull request would be felt. In parallel it costs wall time only up to
  # its own duration, and runner minutes are free on a public repository.
  #
  # It runs on pull requests rather than only on main, because a merge to main
  # deploys. Catching a regression after the merge means catching it after it is
  # live.
  #
  # Until this existed the mutation floors were enforced by nobody: `npm run
  # test:mutation` was a thing somebody remembered to type. Coverage thresholds
  # cannot tell whether a test checks anything; this can, and a gate nothing runs
  # is not a gate.
  mutation:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # packages/dynamodb mutates code covered by integration tests, so this job
      # needs a table of its own.
      id-token: write

    env:
      # A different name from the build job's. Both run concurrently under the
      # same run_id, and two jobs creating one table is a race that presents as
      # a confusing ResourceInUseException.
      LEDGER_TEST_TABLE: tightarse-citest-${{ github.run_id }}-${{ github.run_attempt }}-mut
      AWS_REGION: eu-west-2

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Stryker runs the suite, and the suite resolves workspace packages through
      # their dist. A fresh checkout has none.
      - name: Build
        run: npm run typecheck

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::707256068475:role/tightarse-dev-github-citest
          aws-region: eu-west-2
          role-session-name: gha-mutation-${{ github.run_id }}

      - name: Create the ephemeral ledger table
        run: npm run create-test-table -w @tightarse/dynamodb

      # Every package, each against its own pinned floor. The floors are what the
      # suite achieves today, so this fails when tests stop checking something
      # rather than when a package misses an arbitrary target. Raise them, never
      # lower them.
      - name: Mutation testing
        run: npm run test:mutation

      - name: Destroy the ephemeral ledger table
        if: always()
        run: npm run create-test-table -w @tightarse/dynamodb -- --delete

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The binary, not gitleaks-action. The action requires a paid licence on an
      # organisation repository and fails with "missing gitleaks license" — which
      # is what happened the moment this repo moved to the org. The scanner itself
      # is MIT and needs nothing.
      #
      # `--redact` so a finding never prints the secret it found into a public
      # build log, which would publish the thing the check exists to prevent.
      - name: gitleaks
        run: |
          VERSION=8.28.0
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks --version
          gitleaks detect --source . --redact --verbose --exit-code 1

  # Deploy on merge to main, with no AWS key stored anywhere.
  #
  # GitHub signs a token describing this specific run; AWS trusts that signature
  # and STS exchanges it for credentials lasting an hour. The role is scoped to
  # this repository AND the "dev" environment, so a token minted by any other
  # repo — or by a job in this one that does not declare the environment —
  # fails the trust policy.
  #
  # The environment is also where an approval rule lives. Add required reviewers
  # under Settings → Environments → dev and every deploy waits for a human. That
  # is worth considering: this account holds five years of real transactions.
  deploy:
    # Both, because a merge to main deploys. A mutation regression that only
    # failed a job the deploy did not wait for would reach AWS anyway, which
    # would make the gate decorative in the one place it matters most.
    needs: [build, mutation]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: dev

    permissions:
      contents: read
      # Without this GitHub will not mint the token at all, and the failure
      # reads as a credentials error rather than a missing permission.
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::707256068475:role/tightarse-dev-github-deploy
          aws-region: eu-west-1
          role-session-name: gha-${{ github.run_id }}

      # Jobs do not share a filesystem, so this one has to build for itself.
      # Without it esbuild cannot resolve @tightarse/dynamodb while bundling the
      # Lambdas — the workspace symlinks exist after npm ci, but they point at
      # dist directories nothing has produced yet.
      - name: Build the workspaces
        run: npm run typecheck

      # cdk synth deploys web/dist as an asset and fails without it.
      - name: Build the web app
        run: npm run build -w @tightarse/web

      # An empty alertEmail would not fail the deploy — it would quietly remove
      # the SNS subscription and take the consent-expiry warnings with it. Fail
      # here instead, where the cause is obvious.
      - name: Check the alert address is configured
        env:
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
        run: |
          if [ -z "$ALERT_EMAIL" ]; then
            echo "ALERT_EMAIL secret is not set. Deploying without it would silently"
            echo "delete the alert subscription. Set it under Settings -> Secrets."
            exit 1
          fi

      # Named stacks rather than `--all`, and cdk directly rather than through
      # npm, which does not forward arguments reliably through a nested script.
      #
      # TightarseWeb-dev is included again: the account verification that used
      # to refuse a CloudFront distribution has cleared, and the distribution
      # exists. Its domain is in config.ts rather than passed here, because CDK
      # context given on the command line is not persisted — a deploy without it
      # would drop the callback URL from the user pool and revert the bank
      # redirect to localhost, breaking the deployed site with nothing in the
      # diff to explain it.
      - name: Deploy
        working-directory: infra
        run: |
          npx cdk deploy \
            TightarseFoundation-dev \
            TightarseData-dev \
            TightarseApi-dev \
            TightarseIngest-dev \
            TightarseWeb-dev \
            --require-approval never
