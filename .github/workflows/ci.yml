name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # For the integration tests' table. Without this GitHub will not mint the
      # token at all, and the failure reads as a credentials error rather than
      # as a missing permission.
      id-token: write

    env:
      # A table per run, in a region that holds no real data, under the only
      # name prefix the credential is allowed to touch. run_attempt is in the
      # name because a re-run of the same workflow would otherwise collide with
      # a table the first attempt may not have finished deleting.
      LEDGER_TEST_TABLE: tightarse-citest-${{ github.run_id }}-${{ github.run_attempt }}
      AWS_REGION: eu-west-2

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Covers test files too, under three configs: the strict root one, infra's
      # relaxed CDK settings, and web's own. Test files are excluded from the
      # build, so until this existed nothing checked their types.
      - name: Typecheck
        run: npm run typecheck

      # Real DynamoDB rather than the emulator, because the emulator is wrong in
      # exactly the place this schema is interesting: the same suite took
      # different paths against Local and against real DynamoDB, and
      # putEnrichment is a TransactWriteItems carrying a ConditionCheck, which
      # is where the divergence concentrates.
      #
      # This role can do nothing but DynamoDB, only in eu-west-2, and only to
      # tables named tightarse-citest-*. It is deliberately not the deploy role:
      # that one can assume the CDK bootstrap roles, and this job runs on every
      # pull request.
      #
      # A pull request from a fork carries the fork's OIDC subject, matches no
      # trust policy here, and fails this step. That is the intended outcome —
      # the alternative is a run whose integration tests skip in silence.
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::707256068475:role/tightarse-dev-github-citest
          aws-region: eu-west-2
          role-session-name: gha-citest-${{ github.run_id }}

      - name: Create the ephemeral ledger table
        run: npm run create-test-table -w @tightarse/ledger

      # Coverage thresholds are pinned per package at what it achieves today, so
      # this fails when coverage falls rather than when it misses an arbitrary
      # target. See vitest.shared.ts.
      - name: Test with coverage thresholds
        run: npm run test:coverage

      # always(), because a failed test run still leaves a table behind, and a
      # table per run adds up. The script refuses any name outside the citest
      # prefix, so a mistyped variable here cannot delete anything that matters.
      - name: Destroy the ephemeral ledger table
        if: always()
        run: npm run create-test-table -w @tightarse/ledger -- --delete

      # The web stack deploys web/dist as an asset, so synth cannot run without
      # it. CI never built it, and every push since "Add the dashboard hosting
      # stack" failed here — twenty commits of red that nobody looked at.
      - name: Build the web app
        run: npm run build -w @tightarse/web

      - name: Synth CDK
        run: npm run synth

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Deploy on merge to main, with no AWS key stored anywhere.
  #
  # GitHub signs a token describing this specific run; AWS trusts that signature
  # and STS exchanges it for credentials lasting an hour. The role is scoped to
  # this repository AND the "dev" environment, so a token minted by any other
  # repo — or by a job in this one that does not declare the environment —
  # fails the trust policy.
  #
  # The environment is also where an approval rule lives. Add required reviewers
  # under Settings → Environments → dev and every deploy waits for a human. That
  # is worth considering: this account holds five years of real transactions.
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: dev

    permissions:
      contents: read
      # Without this GitHub will not mint the token at all, and the failure
      # reads as a credentials error rather than a missing permission.
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::707256068475:role/tightarse-dev-github-deploy
          aws-region: eu-west-1
          role-session-name: gha-${{ github.run_id }}

      # Jobs do not share a filesystem, so this one has to build for itself.
      # Without it esbuild cannot resolve @tightarse/ledger while bundling the
      # Lambdas — the workspace symlinks exist after npm ci, but they point at
      # dist directories nothing has produced yet.
      - name: Build the workspaces
        run: npm run typecheck

      # cdk synth deploys web/dist as an asset and fails without it.
      - name: Build the web app
        run: npm run build -w @tightarse/web

      # An empty alertEmail would not fail the deploy — it would quietly remove
      # the SNS subscription and take the consent-expiry warnings with it. Fail
      # here instead, where the cause is obvious.
      - name: Check the alert address is configured
        env:
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
        run: |
          if [ -z "$ALERT_EMAIL" ]; then
            echo "ALERT_EMAIL secret is not set. Deploying without it would silently"
            echo "delete the alert subscription. Set it under Settings -> Secrets."
            exit 1
          fi

      # Named stacks rather than `--all`, and cdk directly rather than through
      # npm, which does not forward arguments reliably through a nested script.
      #
      # TightarseWeb-dev is omitted on purpose: creating its CloudFront
      # distribution is refused until the AWS account is verified (#8), so
      # including it would leave this job permanently red and train everyone to
      # ignore it. Add it back when that support case closes.
      - name: Deploy
        working-directory: infra
        run: |
          npx cdk deploy \
            TightarseFoundation-dev \
            TightarseData-dev \
            TightarseApi-dev \
            TightarseIngest-dev \
            --require-approval never \
            -c alertEmail="$ALERT_EMAIL"
        env:
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
