name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    # The ledger's integration tests were skipping on every push for want of a
    # table, which is a green tick that means nothing. DynamoDB Local costs a
    # few seconds and runs them for real.
    services:
      dynamodb:
        image: amazon/dynamodb-local:latest
        ports:
          - 8000:8000

    env:
      LEDGER_TEST_TABLE: Ledger
      LEDGER_TEST_ENDPOINT: http://localhost:8000
      AWS_REGION: eu-west-1
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Create the local ledger table
        run: npm run create-test-table -w @tightarse/ledger

      - name: Test
        run: npm test

      # The web stack deploys web/dist as an asset, so synth cannot run without
      # it. CI never built it, and every push since "Add the dashboard hosting
      # stack" failed here — twenty commits of red that nobody looked at.
      - name: Build the web app
        run: npm run build -w @tightarse/web

      - name: Synth CDK
        run: npm run synth

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
